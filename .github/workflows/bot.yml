name: Mesai Bot
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  group: mesai-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kurulum
        run: pip install discord.py

      - name: Botu calistir
        run: python mesai_bot.py || true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Mesai verisini repoya kaydet
        run: |
          git config user.name "mesai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "mesai verisi guncellendi"
          git push
